name: Verify Token-QBloch research artifact

on:
  push:
  pull_request:

jobs:
  archive-and-science:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable Git history for common secrets and private paths
        run: python scripts/scan_git_history.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1,<3"
      - name: Install science and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify archived tables
        run: python scripts/verify_archived_results.py
      - name: Scientific and portability unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end run
        run: python scripts/run_exp37.py --mode synthetic --timeout 300 --output-root outputs/ci-smoke
